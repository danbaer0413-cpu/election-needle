name: update-needle

on:
  schedule:
    # All times UTC. Actions cron is best-effort: runs can start several minutes late.
    # After election night: one update a day, 11:07 am ET, until results are certified (then run the shutdown workflow).
    - cron: "7 16 * * *"
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: needle
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runner.txt
      - run: pip install -r requirements-runner.txt
      - name: Install browser (only if a feed uses fmt=browser)
        run: grep -q ',browser,' config/feeds.csv && playwright install --with-deps chromium || echo 'no browser feeds'
      - name: Read VoteHub posts (statewide early vote; failure is fine)
        timeout-minutes: 2
        continue-on-error: true
        run: python votehub.py
      - name: Pull early vote from civicAPI (free, credit civicAPI; failure is fine)
        timeout-minutes: 2
        continue-on-error: true
        run: python civic_early.py
      - name: Automated calls (two sources must agree; failure is fine)
        timeout-minutes: 2
        if: github.event_name == 'workflow_dispatch' || contains('*/10 23 3 11 *|*/10 0-13 4 11 *|7 16 * * *', github.event.schedule)
        continue-on-error: true
        run: python auto_calls.py
      - name: Pull polls from PollResults.org (NYT poll data, CC BY 4.0; failure is fine)
        timeout-minutes: 2
        if: github.event_name == 'workflow_dispatch' || contains('7 */12 * * *|17 */3 30-31 10 *|17 */3 1-2 11 *', github.event.schedule)
        continue-on-error: true
        run: python fetch_polls.py
      - name: Preflight (warnings only)
        continue-on-error: true
        run: python check_setup.py
      - run: python run_update.py
      - name: Vote dumps log (display only)
        continue-on-error: true
        timeout-minutes: 1
        run: python dumps.py
      - name: Commit results
        run: |
          git config user.name "needle-bot"
          git config user.email "needle-bot@users.noreply.github.com"
          for f in data/latest.json data/needle_log.csv data/votehub_latest.csv data/votehub_history.csv data/votehub_state.json data/votehub_unparsed.txt data/votehub_raw.jsonl \
                   data/poll_inputs_auto.csv data/polls_all.csv data/poll_average.json data/polls_raw data/bsky_raw.json \
                   data/bsky_unmatched.txt data/poll_compare.csv data/night/early_civic.csv data/civic_early_log.csv data/house/lean.json data/auto_calls.csv data/calls_pending.csv data/auto_calls_log.csv data/vote_dumps.csv data/dumps_prev.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          # early vote files the model merged into (returned ballots only go up, so keep them)
          git add data/*/early.csv data/*/*/early.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "needle update"
            git pull --rebase --autostash -X theirs || git rebase --abort
            git push || (git pull --rebase --autostash -X theirs && git push)
          fi
