name: update-needle

on:
  schedule:
    - cron: "7 */12 * * *"
    - cron: "*/10 23 3 11 *"
    - cron: "*/10 0-13 4 11 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: needle
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runner.txt
      - run: pip install -r requirements-runner.txt
      - name: Read VoteHub posts (statewide early vote; failure is fine)
        continue-on-error: true
        run: python votehub.py
      - run: python run_update.py
      - name: Commit results
        run: |
          git config user.name "needle-bot"
          git config user.email "needle-bot@users.noreply.github.com"
          git add data/latest.json data/needle_log.csv data/votehub_latest.csv data/votehub_history.csv data/votehub_unparsed.txt 2>/dev/null || git add data/latest.json data/needle_log.csv
          if ! git diff --cached --quiet; then
            git commit -m "needle update"
            git pull --rebase
            git push
          fi
