name: probe-portals
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe_portals.py
      - name: Save report
        run: |
          git config user.name "needle-bot"
          git config user.email "needle-bot@users.noreply.github.com"
          git add data/portal_probe.txt
          if ! git diff --cached --quiet; then git commit -m "portal probe"; git pull --rebase -X theirs || git rebase --abort; git push; fi
