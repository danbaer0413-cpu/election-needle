name: house-full
# One-off: every 2026 House race from civicAPI into data/house/house_2026_all.csv (run by hand)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python house_full.py
      - name: Commit
        run: |
          git config user.name needle-bot
          git config user.email needle-bot@users.noreply.github.com
          git add data/house/house_2026_all.csv
          git diff --cached --quiet || git commit -m "House: all 2026 races from civicAPI"
          git pull --rebase -q && git push -q
