name: probe-browser
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python probe_browser.py
        continue-on-error: true
      - name: Save report
        run: |
          git config user.name "needle-bot"
          git config user.email "needle-bot@users.noreply.github.com"
          git add data/portal_browser.txt
          git commit -m "browser probe report" || echo "nothing to commit"
          git pull --rebase -X theirs || true
          git push || (sleep 5 && git pull --rebase -X theirs && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: portal-browser
          path: data/portal_browser.txt
