name: probe-targets
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas lxml
      - run: python probe_targets.py
      - name: Save report
        run: |
          git config user.name "needle-bot"
          git config user.email "needle-bot@users.noreply.github.com"
          git add data/portal_targets.txt
          if ! git diff --cached --quiet; then git commit -m "targets probe"; git pull --rebase -X theirs || git rebase --abort; git push; fi
