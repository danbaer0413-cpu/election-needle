name: build-geo
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-runner.txt
      - run: python build_geo.py
      - name: Save outlines
        run: |
          git config user.name "needle-bot"
          git config user.email "needle-bot@users.noreply.github.com"
          git add data/geo
          if ! git diff --cached --quiet; then git commit -m "county outlines"; git pull --rebase -X theirs || git rebase --abort; git push; fi
