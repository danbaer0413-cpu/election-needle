name: probe-followup
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests && playwright install --with-deps chromium
      - run: python probe_followup.py
        continue-on-error: true
      - run: python probe_browser.py WI NE IA SC KS AK NH FL ME MS OH MI GA2
        continue-on-error: true
      - run: python probe_links.py
        continue-on-error: true
      - name: Save reports
        run: |
          git config user.name "needle-bot"
          git config user.email "needle-bot@users.noreply.github.com"
          git add data/portal_followup.txt data/portal_browser.txt data/portal_links.txt
          git commit -m "follow-up probe reports" || echo "nothing to commit"
          git pull --rebase -X theirs || true
          git push || (sleep 5 && git pull --rebase -X theirs && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: portal-followup
          path: |
            data/portal_followup.txt
            data/portal_browser.txt
            data/portal_links.txt
